name: Курс

# Прогон всех 80 серий и 7 сквозных проектов.
# Тесты курса детерминированы: никаких таймингов, PID и системного времени
# в сравниваемом выводе — иначе они бы падали через раз именно здесь.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: make test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Версия компилятора
        run: cc --version

      - name: Все серии
        run: make test

      - name: Сквозные проекты
        run: make projects
